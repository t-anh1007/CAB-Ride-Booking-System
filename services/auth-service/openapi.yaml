openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
  description: API quản lý xác thực và OTP cho CAB Booking.

paths:
  /login/otp/request:
    post:
      summary: Yêu cầu gửi mã OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  example: "0912345678"
      responses:
        '200':
          description: OTP đã được gửi
        '429':
          description: Gửi quá nhanh (Rate limit)

  /login/otp/verify:
    post:
      summary: Xác thực OTP và nhận Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        '401':
          description: OTP không chính xác
