name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            directory: gateway/api-gateway
            command: npm test
          - name: auth-service
            directory: services/auth-service
            command: npm test
          - name: review-service
            directory: services/review-service
            command: npm test
          - name: notification-service
            directory: services/notification-service
            command: node --test test/notification-service.test.js
          - name: eta-service
            directory: AI-ML/eta-service
            command: node --test test/tracking.test.js
          - name: governance
            directory: .
            command: npm run test:governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  python-tests:
    name: Python tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-service
            directory: AI-ML/matching-service
          - name: surge-pricing-service
            directory: AI-ML/surge-pricing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: python -m pip install -r requirements.txt pytest==8.3.5 httpx==0.28.1
      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.directory }}
        run: python -m pytest app/tests -q
