services:
  api-gateway:
    secrets:
      - realtime_internal_key
    environment:
      REALTIME_INTERNAL_KEY_FILE: /run/secrets/realtime_internal_key

  notification-service:
    secrets:
      - realtime_internal_key
      - notification_mongodb_uri
    environment:
      REALTIME_INTERNAL_KEY_FILE: /run/secrets/realtime_internal_key
      NOTIFICATION_MONGODB_URI_FILE: /run/secrets/notification_mongodb_uri

  auth-service:
    secrets:
      - auth_db_password
      - auth_redis_password
      - auth_admin_mfa_encryption_key
      - auth_jwt_active_private_key_pem
      - auth_jwt_active_public_key_pem
      - auth_jwt_previous_public_key_pem
      - auth_bootstrap_admin_password
    environment:
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_REDIS_PASSWORD_FILE: /run/secrets/auth_redis_password
      AUTH_ADMIN_MFA_ENCRYPTION_KEY_FILE: /run/secrets/auth_admin_mfa_encryption_key
      AUTH_JWT_ACTIVE_PRIVATE_KEY_PEM_FILE: /run/secrets/auth_jwt_active_private_key_pem
      AUTH_JWT_ACTIVE_PUBLIC_KEY_PEM_FILE: /run/secrets/auth_jwt_active_public_key_pem
      AUTH_JWT_PREVIOUS_PUBLIC_KEY_PEM_FILE: /run/secrets/auth_jwt_previous_public_key_pem
      AUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/auth_bootstrap_admin_password

  user-service:
    secrets:
      - user_database_url
      - postgres_password
    environment:
      DATABASE_URL_FILE: /run/secrets/user_database_url
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  payment-service:
    secrets:
      - payment_mongodb_uri
    environment:
      MONGODB_URI_FILE: /run/secrets/payment_mongodb_uri

  postgres:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  mongodb:
    secrets:
      - mongodb_root_password
    environment:
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password

  redis:
    secrets:
      - redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$(cat /run/secrets/redis_password)\""

secrets:
  realtime_internal_key:
    external: true
  notification_mongodb_uri:
    external: true
  auth_db_password:
    external: true
  auth_redis_password:
    external: true
  auth_admin_mfa_encryption_key:
    external: true
  auth_jwt_active_private_key_pem:
    external: true
  auth_jwt_active_public_key_pem:
    external: true
  auth_jwt_previous_public_key_pem:
    external: true
  auth_bootstrap_admin_password:
    external: true
  user_database_url:
    external: true
  payment_mongodb_uri:
    external: true
  postgres_password:
    external: true
  mongodb_root_password:
    external: true
  redis_password:
    external: true
