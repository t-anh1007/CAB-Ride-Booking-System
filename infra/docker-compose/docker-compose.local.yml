name: cab-booking-local

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: gateway/api-gateway/Dockerfile
    image: cab-api-gateway:local
    container_name: cab-api-gateway
    env_file:
      - ../../gateway/api-gateway/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ../../gateway/api-gateway:/app/gateway/api-gateway
      - /app/gateway/api-gateway/node_modules
    depends_on:
      auth-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      user-service:
        condition: service_started
      pricing-service:
        condition: service_started
      matching-service:
        condition: service_started
      review-service:
        condition: service_started
      driver-service:
        condition: service_started
      notification-service:
        condition: service_started
      ride-service:
        condition: service_started
      eta-service:
        condition: service_started
    networks:
      - cab-edge
      - cab-services

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: cab-payment-service:local
    container_name: cab-payment-service
    env_file:
      - ../../services/payment-service/.env.docker
    expose:
      - "3102"
    depends_on:
      payment-mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - payment-data
      - cab-broker

  booking-service:
    build:
      context: ../..
      dockerfile: services/booking-service/Dockerfile
    image: cab-booking-service:local
    container_name: cab-booking-service
    env_file:
      - ../../services/booking-service/.env.docker
    expose:
      - "3103"
    volumes:
      - ../../services/booking-service:/app/services/booking-service
      - /app/services/booking-service/node_modules
    depends_on:
      booking-mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - booking-data
      - cab-broker
      - ml-platform-data

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: cab-auth-service:local
    container_name: cab-auth-service
    env_file:
      - ../../services/auth-service/.env.docker
    expose:
      - "3104"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - auth-data
      - cab-broker

  matching-service:
    build:
      context: ../..
      dockerfile: AI-ML/matching-service/Dockerfile
    image: cab-matching-service:local
    container_name: cab-matching-service
    env_file:
      - ../../AI-ML/matching-service/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - cab_ml_model_store:/app/model_store
    depends_on:
      ml-mongodb:
        condition: service_started
      ml-redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - ml-platform-data
      - cab-broker
      - booking-data
      - driver-data

  surge-pricing-service:
    build:
      context: ../..
      dockerfile: AI-ML/surge-pricing-service/Dockerfile
    image: cab-surge-pricing-service:local
    container_name: cab-surge-pricing-service
    env_file:
      - ../../AI-ML/surge-pricing-service/.env.docker
    expose:
      - "8001"
    volumes:
      - cab_surge_model_store:/app/model_store
    depends_on:
      ml-mongodb:
        condition: service_started
      ml-redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - ml-platform-data
      - cab-broker

  pricing-service:
    build:
      context: ../..
      dockerfile: services/pricing-service/Dockerfile
    image: cab-pricing-service:local
    container_name: cab-pricing-service
    env_file:
      - ../../services/pricing-service/.env.docker
    expose:
      - "3101"
    volumes:
      - ../../services/pricing-service:/app/services/pricing-service
      - /app/services/pricing-service/node_modules
    depends_on:
      pricing-mongodb:
        condition: service_started
      kafka:
        condition: service_started
      ml-redis:
        condition: service_started
      surge-pricing-service:
        condition: service_started
    networks:
      - cab-services
      - pricing-data
      - ml-platform-data   # đọc surge_zone:* keys từ Redis của ML Platform
      - cab-broker

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    image: cab-user-service:local
    container_name: cab-user-service
    env_file:
      - ../../services/user-service/.env.docker
    expose:
      - "3105"
    depends_on:
      user-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cab-services
      - user-data
      - cab-broker

  review-service:
    build:
      context: ../..
      dockerfile: services/review-service/Dockerfile
    image: cab-review-service:local
    container_name: cab-review-service
    env_file:
      - ../../services/review-service/.env.docker
    expose:
      - "3106"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-broker

  driver-service:
    build:
      context: ../..
      dockerfile: services/driver-service/Dockerfile
    image: cab-driver-service:local
    container_name: cab-driver-service
    env_file:
      - ../../services/driver-service/.env.docker
    expose:
      - "3107"
    depends_on:
      driver-mongodb:
        condition: service_started
      kafka:
        condition: service_started
      ml-redis:
        condition: service_started
    networks:
      - cab-services
      - driver-data
      - cab-broker
      - ml-platform-data   # ghi supply:zone:* keys vào Redis của ML Platform

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: cab-notification-service:local
    container_name: cab-notification-service
    env_file:
      - ../../services/notification-service/.env.docker
    expose:
      - "3108"
    depends_on:
      notification-mongodb:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cab-services
      - notification-data
      - cab-broker

  ride-service:
    build:
      context: ../..
      dockerfile: services/ride-service/Dockerfile
    image: cab-ride-service:local
    container_name: cab-ride-service
    env_file:
      - ../../services/ride-service/.env.docker
    ports:
      - "3109:3109"
    depends_on:
      ride-mongodb:
        condition: service_started
      ride-redis:
        condition: service_started
      eta-service:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - ../../services/ride-service:/app/services/ride-service
      - /app/services/ride-service/node_modules
    networks:
      - cab-services
      - ride-data
      - cab-broker

  eta-service:
    build:
      context: ../..
      dockerfile: AI-ML/eta-service/Dockerfile
    image: cab-eta-service:local
    container_name: cab-eta-service
    env_file:
      - ../../AI-ML/eta-service/.env.docker
    expose:
      - "3110"
    depends_on:
      eta-redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cab-services
      - eta-data
      - cab-broker

  # ── ETA AI Redis (hot-store for ETA cache & driver locations) ──────────────
  eta-redis:
    image: redis:7-alpine
    container_name: cab-eta-redis
    expose:
      - "6379"
    volumes:
      - cab_eta_redis_data:/data
    networks:
      - eta-data

  payment-mongodb:
    image: mongo:7
    container_name: cab-payment-mongodb
    expose:
      - "27017"
    volumes:
      - cab_payment_mongodb_data:/data/db
    networks:
      - payment-data

  auth-postgres:
    image: postgres:16-alpine
    container_name: cab-auth-postgres
    environment:
      POSTGRES_DB: cab_booking_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - cab_auth_postgres_data:/var/lib/postgresql/data
      - ../../services/auth-service/sql/schema.sql:/docker-entrypoint-initdb.d/001-auth-schema.sql:ro
    # 002: Đổ dữ liệu mẫu (Cần thêm vào)
      - ../../database_test/auth-seed.sql:/docker-entrypoint-initdb.d/002-auth-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth-data

  auth-redis:
    image: redis:7-alpine
    container_name: cab-auth-redis
    expose:
      - "6379"
    volumes:
      - cab_auth_redis_data:/data
    networks:
      - auth-data

  user-postgres:
    image: postgres:16-alpine
    container_name: cab-user-postgres
    environment:
      POSTGRES_DB: cab_booking_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - cab_user_postgres_data:/var/lib/postgresql/data
      # 1. Tạo bảng trước
      - ../../services/user-service/sql/schema.sql:/docker-entrypoint-initdb.d/001-user-schema.sql:ro
      # 2. Đổ dữ liệu mẫu sau
      - ../../database_test/user-seed.sql:/docker-entrypoint-initdb.d/002-user-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-data

  pricing-mongodb:
    image: mongo:7
    container_name: cab-pricing-mongodb
    expose:
      - "27017"
    volumes:
      - cab_pricing_mongodb_data:/data/db
      #đổ dữ liệu vào
      - ../../database_test/pricing-seed.js:/docker-entrypoint-initdb.d/pricing-seed.js:ro
    networks:
      - pricing-data

  ml-mongodb:
    image: mongo:7
    container_name: cab-ml-mongodb
    ports:
      - "27017:27017"
    volumes:
      - cab_ml_mongodb_data:/data/db
    networks:
      - ml-platform-data

  ml-redis:
    image: redis:7-alpine
    container_name: cab-ml-redis
    ports:
      - "6379:6379"
    volumes:
      - cab_ml_redis_data:/data
    networks:
      - ml-platform-data
      - pricing-data

  booking-mongodb:
    image: mongo:7
    container_name: cab-booking-mongodb
    expose:
      - "27017"
    volumes:
      - cab_booking_mongodb_data:/data/db
      - ../../database_test/booking-seed.js:/docker-entrypoint-initdb.d/booking-seed.js:ro
    networks:
      - booking-data

  driver-mongodb:
    image: mongo:7
    container_name: cab-driver-mongodb
    expose:
      - "27017"
    volumes:
      - cab_driver_mongodb_data:/data/db
      - ../../database_test/driver-seed.js:/docker-entrypoint-initdb.d/driver-seed.js:ro
    networks:
      - driver-data

  notification-mongodb:
    image: mongo:7
    container_name: cab-notification-mongodb
    expose:
      - "27017"
    volumes:
      - cab_notification_mongodb_data:/data/db
    networks:
      - notification-data

  ride-mongodb:
    image: mongo:7
    container_name: cab-ride-mongodb
    expose:
      - "27017"
    volumes:
      - cab_ride_mongodb_data:/data/db
    networks:
      - ride-data

  ride-redis:
    image: redis:7-alpine
    container_name: cab-ride-redis
    expose:
      - "6379"
    volumes:
      - cab_ride_redis_data:/data
    networks:
      - ride-data

  kafka:
    image: apache/kafka:3.7.0
    container_name: cab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    expose:
      - "9092"
    volumes:
      - cab_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - cab-broker

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: cab-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/sh -c "
      echo 'Kafka is healthy. Creating topics...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.assigned --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.location.updated --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.created --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.assigned --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.status.changed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.failed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.success --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eta.result --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created successfully'
      "
    networks:
      - cab-broker

volumes:
  cab_payment_mongodb_data:
  cab_auth_postgres_data:
  cab_auth_redis_data:
  cab_user_postgres_data:
  cab_booking_mongodb_data:
  cab_pricing_mongodb_data:
  cab_driver_mongodb_data:
  cab_notification_mongodb_data:
  cab_ride_mongodb_data:
  cab_ride_redis_data:
  cab_eta_redis_data:
  cab_kafka_data:
  cab_ml_mongodb_data:
  cab_ml_redis_data:
  cab_ml_model_store:
  cab_surge_model_store:

networks:
  cab-edge:
  cab-services:
  cab-broker:
  payment-data:
  auth-data:
  user-data:
  booking-data:
  pricing-data:
  driver-data:
  notification-data:
  ride-data:
  ml-platform-data:
  eta-data:
