name: cab-booking-local

# ─────────────────────────────────────────────────────────────────────────────
# Bản tối ưu cho laptop (Docker Desktop):
#   • Gộp 7 MongoDB -> 1 (mỗi service dùng database riêng trên cùng server)
#   • Gộp 4 Redis   -> 1 (tách theo key-prefix)
#   • Giữ 2 Postgres riêng (auth/user) vì có init script riêng
#   • Cap RAM: WiredTiger cache, Kafka heap, mem_limit mọi container
#   • Profiles: mặc định = stack nhẹ (không AI). Thêm AI: `--profile ai`
#
# Chạy nhẹ (core, không AI):   docker compose -f docker-compose.local.yml up -d
# Chạy đầy đủ (kèm AI):        docker compose -f docker-compose.local.yml --profile ai up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: gateway/api-gateway/Dockerfile
    image: cab-api-gateway:local
    container_name: cab-api-gateway
    mem_limit: 256m
    env_file:
      - ../../gateway/api-gateway/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ../../gateway/api-gateway:/app/gateway/api-gateway
      - /app/gateway/api-gateway/node_modules
    # depends_on chỉ giữ các core service luôn chạy; service AI (matching/eta/
    # pricing) được gọi qua HTTP + circuit breaker nên không cần chờ khởi động.
    depends_on:
      auth-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started
      driver-service:
        condition: service_started
      notification-service:
        condition: service_started
      ride-service:
        condition: service_started
    networks:
      - cab-edge
      - cab-services

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: cab-payment-service:local
    container_name: cab-payment-service
    mem_limit: 200m
    env_file:
      - ../../services/payment-service/.env.docker
    expose:
      - "3102"
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  booking-service:
    build:
      context: ../..
      dockerfile: services/booking-service/Dockerfile
    image: cab-booking-service:local
    container_name: cab-booking-service
    mem_limit: 200m
    env_file:
      - ../../services/booking-service/.env.docker
    expose:
      - "3103"
    volumes:
      - ../../services/booking-service:/app/services/booking-service
      - /app/services/booking-service/node_modules
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: cab-auth-service:local
    container_name: cab-auth-service
    mem_limit: 200m
    env_file:
      - ../../services/auth-service/.env.docker
    expose:
      - "3104"
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  matching-service:
    build:
      context: ../..
      dockerfile: AI-ML/matching-service/Dockerfile
    image: cab-matching-service:local
    container_name: cab-matching-service
    mem_limit: 384m
    profiles: ["ai"]
    env_file:
      - ../../AI-ML/matching-service/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - cab_ml_model_store:/app/model_store
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  surge-pricing-service:
    build:
      context: ../..
      dockerfile: AI-ML/surge-pricing-service/Dockerfile
    image: cab-surge-pricing-service:local
    container_name: cab-surge-pricing-service
    mem_limit: 384m
    profiles: ["ai"]
    env_file:
      - ../../AI-ML/surge-pricing-service/.env.docker
    expose:
      - "8001"
    volumes:
      - cab_surge_model_store:/app/model_store
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  pricing-service:
    build:
      context: ../..
      dockerfile: services/pricing-service/Dockerfile
    image: cab-pricing-service:local
    container_name: cab-pricing-service
    mem_limit: 200m
    profiles: ["ai"]
    env_file:
      - ../../services/pricing-service/.env.docker
    expose:
      - "3101"
    volumes:
      - ../../services/pricing-service:/app/services/pricing-service
      - /app/services/pricing-service/node_modules
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    image: cab-user-service:local
    container_name: cab-user-service
    mem_limit: 200m
    env_file:
      - ../../services/user-service/.env.docker
    expose:
      - "3105"
    depends_on:
      user-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  review-service:
    build:
      context: ../..
      dockerfile: services/review-service/Dockerfile
    image: cab-review-service:local
    container_name: cab-review-service
    mem_limit: 200m
    env_file:
      - ../../services/review-service/.env.docker
    environment:
      MONGO_URI: mongodb://mongodb:27017/cab_booking_review
    expose:
      - "3106"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  driver-service:
    build:
      context: ../..
      dockerfile: services/driver-service/Dockerfile
    image: cab-driver-service:local
    container_name: cab-driver-service
    mem_limit: 200m
    env_file:
      - ../../services/driver-service/.env.docker
    expose:
      - "3107"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cab-services
      - cab-data
      - cab-broker

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: cab-notification-service:local
    container_name: cab-notification-service
    mem_limit: 200m
    env_file:
      - ../../services/notification-service/.env.docker
    expose:
      - "3108"
    depends_on:
      mongodb:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cab-services
      - cab-data
      - cab-broker

  ride-service:
    build:
      context: ../..
      dockerfile: services/ride-service/Dockerfile
    image: cab-ride-service:local
    container_name: cab-ride-service
    mem_limit: 200m
    env_file:
      - ../../services/ride-service/.env.docker
    ports:
      - "3109:3109"
    # eta-service (profile ai) gọi qua HTTP; bỏ khỏi depends_on để chạy core-only.
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - ../../services/ride-service:/app/services/ride-service
      - /app/services/ride-service/node_modules
    networks:
      - cab-services
      - cab-data
      - cab-broker

  eta-service:
    build:
      context: ../..
      dockerfile: AI-ML/eta-service/Dockerfile
    image: cab-eta-service:local
    container_name: cab-eta-service
    mem_limit: 256m
    profiles: ["ai"]
    env_file:
      - ../../AI-ML/eta-service/.env.docker
    expose:
      - "3110"
    depends_on:
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cab-services
      - cab-data
      - cab-broker

  # ── Datastore dùng chung ────────────────────────────────────────────────────
  # MongoDB gộp: mỗi service dùng database riêng (cab_booking_*, cab_matching_*,
  # cab_surge_*). Cache WiredTiger cap 0.4GB để không giành hết RAM máy.
  mongodb:
    image: mongo:7
    container_name: cab-mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.4"]
    mem_limit: 700m
    expose:
      - "27017"
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - cab_mongodb_data:/data/db
      - ../../database_test/booking-seed.js:/docker-entrypoint-initdb.d/booking-seed.js:ro
      - ../../database_test/driver-seed.js:/docker-entrypoint-initdb.d/driver-seed.js:ro
      - ../../database_test/pricing-seed.js:/docker-entrypoint-initdb.d/pricing-seed.js:ro
    networks:
      - cab-data

  # Redis gộp: các service tách nhau bằng key-prefix (cab:auth:, surge_zone:, ...)
  redis:
    image: redis:7-alpine
    container_name: cab-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 160m
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - cab_redis_data:/data
    networks:
      - cab-data

  auth-postgres:
    image: postgres:16-alpine
    container_name: cab-auth-postgres
    mem_limit: 200m
    environment:
      POSTGRES_DB: cab_booking_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - cab_auth_postgres_data:/var/lib/postgresql/data
      - ../../services/auth-service/sql/schema.sql:/docker-entrypoint-initdb.d/001-auth-schema.sql:ro
      - ../../database_test/auth-seed.sql:/docker-entrypoint-initdb.d/002-auth-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cab-data

  user-postgres:
    image: postgres:16-alpine
    container_name: cab-user-postgres
    mem_limit: 200m
    environment:
      POSTGRES_DB: cab_booking_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - cab_user_postgres_data:/var/lib/postgresql/data
      - ../../services/user-service/sql/schema.sql:/docker-entrypoint-initdb.d/001-user-schema.sql:ro
      - ../../database_test/user-seed.sql:/docker-entrypoint-initdb.d/002-user-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cab-data

  kafka:
    image: apache/kafka:3.7.0
    container_name: cab-kafka
    mem_limit: 800m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Giới hạn heap JVM để tiết kiệm RAM trên laptop
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    expose:
      - "9092"
    volumes:
      - cab_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - cab-broker

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: cab-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/sh -c "
      echo 'Kafka is healthy. Creating topics...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.assigned --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.location.updated --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.created --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.assigned --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ride.status.changed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.failed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.success --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eta.result --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created successfully'
      "
    networks:
      - cab-broker

  customer-app:
    profiles: [web]
    build: { context: ../.., dockerfile: apps/customer-app/Dockerfile }
    ports: ["5174:80"]
    mem_limit: 64m
    networks: [cab-edge]
  driver-app:
    profiles: [web]
    build: { context: ../.., dockerfile: apps/driver-app/Dockerfile }
    ports: ["5175:80"]
    mem_limit: 64m
    networks: [cab-edge]
  admin-dashboard:
    profiles: [web]
    build: { context: ../.., dockerfile: apps/admin-dashboard/Dockerfile }
    ports: ["5176:80"]
    mem_limit: 64m
    networks: [cab-edge]

volumes:
  cab_mongodb_data:
  cab_redis_data:
  cab_auth_postgres_data:
  cab_user_postgres_data:
  cab_kafka_data:
  cab_ml_model_store:
  cab_surge_model_store:

networks:
  cab-edge:
  cab-services:
  cab-broker:
  cab-data:
